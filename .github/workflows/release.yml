name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/validate.mjs

      - name: Build import artifact
        run: |
          node scripts/build-import.mjs --out dist/import-base64.txt
          node scripts/validate.mjs --import dist/import-base64.txt
          (cd dist && sha256sum import-base64.txt > import-base64.txt.sha256)

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/import-base64.txt
            dist/import-base64.txt.sha256
          generate_release_notes: true
          body: |
            `import-base64.txt` is the generic Dokploy import (domains are generated as
            `*.sslip.io` by Dokploy). For your own domain, build it locally:
            `npm ci && npm run build:import -- --base-domain example.com`.
            See the README for DNS, HTTPS and first-login steps.
